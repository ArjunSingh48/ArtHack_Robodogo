# IS THIS US? — performance catalog: which artifact appears in which chapter, and how.
#
# Museum metadata (title, artist, date, rights, image) is NOT written here by hand:
#   * artworks already in the matcher collection come from data/artworks/annotations.yaml
#   * the extra early artifacts (`fetch: true`) come from data/performance/records.yaml,
#     generated by `itu show catalog build` from the museum APIs with rights verified
#   * memes come from data/memes/annotations/*.json
# This file only adds what the performance needs. Descriptions repeat what the museum
# says or what is plainly visible; when unsure, they say "possibly".
#
#   chapter       chapter id from script.en.md
#   subject       human_and_dog | dog_only | human_only
#   canine        certain | possible   (is the animal identifiable as a dog?)
#   description   one or two neutral sentences for the screen
#   pose_tags     what is visibly happening (free vocabulary, for people and the voice model)
#   interactive   only for pictures a participant may imitate (see below)
#     pose_subject      human | dog  — whose pose the participant takes. For dog poses the
#                       comparison is semantic only: human and dog skeletons are never scored.
#     safe_to_imitate   true only for poses anyone can take while standing or sitting still
#     request           what the robot asks (replaces {pose_request} in the script)
#     posture           target HumanPosture the camera checks (sitting | standing)
#     head_tilt         true = the camera also looks for a tilted head
#     suggest           one-off suggestions from lines.en.yaml → pose (said once, never checked)
#     priority          lower = preferred
#     crop              optional [x0, y0, x1, y1] (0..1) of the figure, for the comparison read
#     note              what the curator sees (shown in the composition's label)

artifacts:
