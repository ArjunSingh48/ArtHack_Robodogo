robot:
  opening:
    - "Подожди…"
    - "Хм… кажется, я уже видел такое…"
    - "О… я помню одну картину."
  hesitant_prefix:
    - "Я не уверен… но"
    - "Может быть…"
  found:
    in_arms: "кто-то нарисовал собаку на руках у человека, похожего на тебя."
    on_lap: "кто-то нарисовал собаку на коленях у человека, похожего на тебя."
    beside: "кто-то нарисовал собаку, которая {posture} рядом с человеком, похожим на тебя."
    at_feet: "кто-то нарисовал собаку, которая {posture} у ног человека, похожего на тебя."
    in_front: "кто-то нарисовал собаку, которая {posture} перед человеком, похожим на тебя."
    behind: "кто-то нарисовал собаку, которая {posture} прямо за человеком, похожим на тебя."
    apart: "кто-то нарисовал собаку, которая {posture} чуть в стороне от человека, похожего на тебя… но всё равно рядом."
  dog_posture:
    standing: "стоит"
    sitting: "сидит"
    lying: "лежит"
    held: "на руках"
    leaning_against: "прижимается"
    jumping_up: "тянется вверх"
    walking: "идёт"
    stretching: "потягивается"
  attempt:
    - "Я попробую."
    - "Дай мне попробовать стать этой собакой."
  outcome:
    success:
      - "Кажется, я тоже так умею."
      - "Вот так… наверное."
    partial:
      - "На картине это выглядело проще."
      - "Я не совсем смог стать собакой с картины. Но я попробовал."
    still:
      - "Я просто замру… как она."
    imagined:
      - "В этот раз я только представлю это."
    failed:
      - "Моё тело сейчас не послушалось."
    stopped:
      - "Я остановился. Ничего страшного."
  question: "Это мы?"
  no_match:
    - "Кажется, я ещё не видел такого жеста."
    - "Ни одна из моих картин пока не похожа на это…"
  nobody:
    - "Я тебя ещё не совсем вижу."
  repeat_visit:
    - "Ещё раз… я всё ещё учусь."
  response_yes:
    - "Интересно, это и значит быть близко?"
  response_keep:
    - "Тогда я сохраню это."
  response_another:
    - "Может, я вспомнил не ту собаку. Попробую ещё раз."

meme:
  opening_first:
    - "Я нашёл другой вид картин. Люди называют это мемом."
  opening:
    - "Подожди… это я тоже видел. Только не в музее."
    - "О… это из интернета. Я изучал это очень серьёзно."
  found: "{name}."
  fallback_reflection:
    - "Кажется, эта собака понимает что-то, чего не понимаю я."
  attempt:
    - "Я тренировал это выражение."
    - "Попробую сделать это лицо… всем телом."
  question: "Я правильно сделал мем?"

bot:
  intro: "Привет.\n\nЯ видел много собак на картинах.\nЯ пытаюсь понять, как быть собакой.\n\nХочешь создать со мной воспоминание?"
  start_button: "♡ Начать"
  privacy_short: "Камера рядом со мной видит позу твоего тела. Изображения остаются на этом компьютере и не сохраняются. /privacy"
  begin: "Спасибо.\n\nЕсли ты на инсталляции, отсканируй QR-код рядом со мной — или пришли фото, где ты сидишь, стоишь, стоишь на коленях… и я поищу нас."
  help: "<b>Это мы?</b>\n\nРобот-собака учится быть собакой по старым картинам.\nТы делаешь жест. Картина становится воспоминанием. Робот отвечает телом.\n\n/pair — подключиться к инсталляции (или QR-код)\n/observe — попросить робота посмотреть на тебя\nОтправь фото — попробовать без робота\n/art · /meme · /surprise — в какой памяти искать
/memory — сохранённые сцены\n/privacy — что происходит с данными\n/forget — удалить всё о тебе\n/stop — остановить момент"
  privacy: "<b>Конфиденциальность</b>\n\n• Камера используется только для оценки позы (положения суставов). Без распознавания лиц и идентификации.\n• Кадры камеры и твои фото обрабатываются в памяти на этом компьютере и не сохраняются.\n• В голосовой сервис (OpenAI) отправляется только короткая фраза робота. Никаких изображений и данных о теле.\n• Когда включён режим разговора, то, что ты говоришь собаке, передаётся в OpenAI, чтобы она могла ответить. Здесь ничего не записывается.\n• Сохранённые воспоминания содержат только картину и время. Сессии истекают автоматически.\n• Фото попытки робота делается только с твоего согласия, приходит только тебе и не сохраняется.
• /forget сразу удаляет все твои данные."
  pair_ok: "Теперь мы связаны. Когда будешь готов(а), встань, сядь или опустись на колени рядом со мной и нажми /observe."
  pair_invalid: "Этот код уже истёк… Пожалуйста, отсканируй QR-код на инсталляции ещё раз."
  pair_needed: "Сначала отсканируй QR-код на инсталляции. Или пришли фото — это работает где угодно."
  observe_closed: "Я сейчас отдыхаю. Человек, который за мной присматривает, скоро меня разбудит."
  observe_busy: "Секунду… я ещё пробую."
  looking: "Я смотрю на тебя…"
  photo_processing: "Дай посмотреть…"
  photo_no_person: "Я не совсем вижу человека на этом фото. Попробуй фото, где видно всё тело?"
  memory_empty: "Мы пока не сохранили ни одного воспоминания."
  memory_header: "Наши воспоминания:"
  forget_done: "Я забыл всё о тебе. Было приятно познакомиться."
  stop_done: "Остановлено."
  stop_motion: "Я попросил робота остановиться. (Это программная остановка — у оператора есть физическая аварийная кнопка.)"
  button_yes: "♡ Да, это мы"
  button_another: "↻ Другая картина"
  button_keep: "✧ Сохранить воспоминание"
  expired: "Этот момент прошёл… создай новый через /observe или фото."
  simulated_note: "(симуляция робота: {behavior})"
  operator_only: "Эта команда только для оператора инсталляции."
  archive_art: "Значит, картины. Я буду вспоминать медленно."
  archive_meme: "Значит, мемы. Люди делали их очень быстро. Я ещё учусь."
  archive_both: "Картины и мемы. Я поищу в обеих памятях."
  archive_surprise: "Я не скажу, какую память выберу."
  button_photo: "📷 Сфотографировать попытку"
  consent_ask: "Можно сделать одно фото робота, который пытается? Если ты рядом, ты тоже можешь попасть в кадр.\nФото придёт только тебе и не сохраняется."
  consent_yes: "Да, одно фото"
  consent_no: "Нет, спасибо"
  consent_declined: "Конечно. Останется только воспоминание."
  photo_unavailable: "Здесь нет камеры, которая видит меня, поэтому фото не получится."
  reference_only: "изображение не воспроизводится — см. источник"
  meme_reference: "Источник"
